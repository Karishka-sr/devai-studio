name: DevAI free-form debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: server/models/google_gemma-3-4b-it-Q4_K_M.gguf
          key: devai-gemma-3-4b-q4-k-m-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python>=0.3.37"
          pip install --no-cache-dir pypdf

      - name: Download model if missing
        run: |
          mkdir -p server/models
          test -f server/models/google_gemma-3-4b-it-Q4_K_M.gguf || \
            curl -L --retry 5 --retry-delay 5 \
              -o server/models/google_gemma-3-4b-it-Q4_K_M.gguf \
              "https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf"

      - name: Prepare bot secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_COMMENTS_CHAT: ${{ secrets.TELEGRAM_COMMENTS_CHAT }}
        run: |
          mkdir -p server/data
          printf '%s' "$TELEGRAM_BOT_TOKEN" > server/data/devai_ai_bot_token
          cat > server/data/devai_ai_bot.env <<EOF
          DEVAI_API_BASE=http://127.0.0.1:12001
          TELEGRAM_CHANNEL=@devaiAI
          TELEGRAM_ADMIN_IDS=$TELEGRAM_ADMIN_IDS
          TELEGRAM_COMMENTS_CHAT=$TELEGRAM_COMMENTS_CHAT
          DEVAI_CHANNEL_FREEFORM=1
          DEVAI_CHANNEL_INTERVAL=900
          DEVAI_CHANNEL_AI=0
          DEVAI_AUTOPOST=1
          DEVAI_PERSONA_ENABLED=1
          DEVAI_PERSONA_INTERVAL=5400
          DEVAI_COMMENTS_ENABLED=1
          EOF

      - name: Generate one free post
        run: |
          python3 server/devai_server.py > /tmp/devai_server.log 2>&1 &
          echo $! > /tmp/devai_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:12001/health > /tmp/devai_health.json; then
              cat /tmp/devai_health.json
              break
            fi
            sleep 2
          done
          cd server
          python3 - <<'PY'
          import traceback
          import devai_ai_bot as b
          b.init_db()
          print("key:", bool(b.ensure_channel_key()))
          try:
              text = b.build_free_post(force=True)
              print("len:", len(text))
              print(text[:1500])
          except Exception:
              traceback.print_exc()
          PY
          kill "$(cat /tmp/devai_server.pid)" 2>/dev/null || true
          tail -n 80 /tmp/devai_server.log || true
