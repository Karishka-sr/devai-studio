name: Update site release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: site-release
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh docs/data/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_site_release.py

      - name: Commit and push
        run: |
          if git diff --quiet -- docs/data/latest.json; then
            echo "Release data is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git commit -m "chore: update site release data"
          git push
